<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReUse Market</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #333;
}

header {
    background: #176b45;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin-bottom: 8px;
}

nav {
    background: #124d33;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 15px;
    flex-wrap: wrap;
}

button {
    cursor: pointer;
}

nav button {
    background: white;
    color: #176b45;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
}

nav button:hover {
    background: #d8f3e5;
}

main {
    min-height: 75vh;
    padding: 30px 20px;
}

.page {
    max-width: 1100px;
    margin: auto;
}

.hidden {
    display: none !important;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #176b45;
}

/* LOGIN */

.login-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.register-container {
    margin: 25px auto;
}

#loginMessage,
#registerMessage {
    text-align: center;
    margin: 15px;
    font-weight: bold;
    color: #176b45;
}

/* HOME */

.hero {
    background: white;
    text-align: center;
    padding: 70px 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ccc;
}

.hero h2 {
    font-size: 32px;
}

.hero p {
    margin-bottom: 25px;
}

.hero button {
    background: #176b45;
    color: white;
    border: none;
    padding: 13px 25px;
    margin: 8px;
    border-radius: 5px;
}

/* FORMS */

.form-container {
    background: white;
    max-width: 550px;
    margin: auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ccc;
}

form {
    display: flex;
    flex-direction: column;
}

label {
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input, select, textarea {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

form button {
    margin-top: 20px;
    padding: 13px;
    background: #176b45;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
}

form button:hover,
.hero button:hover {
    background: #124d33;
}

#sellMessage {
    text-align: center;
    margin-top: 15px;
    color: green;
    font-weight: bold;
}

/* SEARCH */

.filters {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.filters input,
.filters select {
    flex: 1;
}

/* PRODUCTS */

.product-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 2px 8px #ccc;
}

.product-card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    border-radius: 7px;
    background: #eee;
}

.product-card h3 {
    margin: 12px 0;
    color: #176b45;
}

.product-card p {
    margin: 8px 0;
}

.product-card .price {
    font-size: 20px;
    font-weight: bold;
    color: #176b45;
}

.buy-btn {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #176b45;
    color: white;
    border: none;
    border-radius: 5px;
}

.no-products {
    text-align: center;
    grid-column: 1 / -1;
    padding: 30px;
}

/* CHECKOUT */

.cancel-btn {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    background: #777;
    color: white;
    border: none;
    border-radius: 5px;
}

#checkoutProduct {
    background: #f4f6f8;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 5px;
}

/* FOOTER */

footer {
    background: #124d33;
    color: white;
    text-align: center;
    padding: 18px;
    margin-top: 30px;
}

/* MOBILE */

@media (max-width: 600px) {

    .filters {
        flex-direction: column;
    }

    .hero {
        padding: 40px 15px;
    }

    .form-container {
        padding: 20px;
    }

}

</style>
</head>

<body>

<header>
    <h1>ReUse Market</h1>
    <p>Buy and Sell Used Products Easily</p>
</header>

<nav id="navbar" class="hidden">
    <button onclick="showPage('home')">Home</button>
    <button id="buyNav" onclick="showPage('buy')">Buy Products</button>
    <button id="sellNav" onclick="showPage('sell')">Sell Products</button>
    <button onclick="logout()">Logout</button>
</nav>

<main>

<!-- LOGIN PAGE -->

<section id="login" class="page">

    <h2>Login to ReUse Market</h2>

    <div class="login-container">

        <div class="form-container">

            <h2>Buyer Login</h2>

            <form id="buyerLoginForm">

                <label>Username:</label>
                <input type="text" id="buyerLoginUsername" required>

                <label>Password:</label>
                <input type="password" id="buyerLoginPassword" required>

                <button type="submit">Buyer Login</button>

            </form>

        </div>

        <div class="form-container">

            <h2>Seller Login</h2>

            <form id="sellerLoginForm">

                <label>Username:</label>
                <input type="text" id="sellerLoginUsername" required>

                <label>Password:</label>
                <input type="password" id="sellerLoginPassword" required>

                <button type="submit">Seller Login</button>

            </form>

        </div>

    </div>

    <p id="loginMessage"></p>

    <div class="form-container register-container">

        <h2>Create New Account</h2>

        <form id="registerForm">

            <label>Account Type:</label>

            <select id="registerRole">
                <option value="buyer">Buyer</option>
                <option value="seller">Seller</option>
            </select>

            <label>Username:</label>
            <input type="text" id="registerUsername" required>

            <label>Password:</label>
            <input type="password" id="registerPassword" required>

            <button type="submit">Register</button>

        </form>

        <p id="registerMessage"></p>

    </div>

</section>


<!-- HOME PAGE -->

<section id="home" class="page hidden">

    <div class="hero">

        <h2>Welcome to ReUse Market!</h2>

        <p id="welcomeMessage"></p>

        <p>Give used products a second life.</p>

        <button id="homeBuyButton" onclick="showPage('buy')">
            Explore Products
        </button>

        <button id="homeSellButton" onclick="showPage('sell')">
            Sell Your Product
        </button>

    </div>

</section>


<!-- BUY PAGE -->

<section id="buy" class="page hidden">

    <h2>Available Products</h2>

    <div class="filters">

        <input type="text" id="searchInput"
        placeholder="Search products...">

        <select id="categoryFilter">

            <option value="All">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
            <option value="Books">Books</option>
            <option value="Vehicles">Vehicles</option>
            <option value="Clothing">Clothing</option>

        </select>

    </div>

    <div id="productList" class="product-list"></div>

</section>


<!-- SELL PAGE -->

<section id="sell" class="page hidden">

    <div class="form-container">

        <h2>Sell Your Product</h2>

        <form id="sellForm">

            <label>Product Name:</label>
            <input type="text" id="productName" required>

            <label>Price (₹):</label>
            <input type="number" id="productPrice" min="1" required>

            <label>Category:</label>

            <select id="productCategory">

                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Books">Books</option>
                <option value="Vehicles">Vehicles</option>
                <option value="Clothing">Clothing</option>

            </select>

            <label>Description:</label>
            <textarea id="productDescription" required></textarea>

            <label>Product Image URL (Optional):</label>
            <input type="url" id="productImage">

            <button type="submit">Post Product</button>

        </form>

        <p id="sellMessage"></p>

    </div>

</section>


<!-- CHECKOUT PAGE -->

<section id="checkout" class="page hidden">

    <div class="form-container">

        <h2>Checkout</h2>

        <div id="checkoutProduct"></div>

        <form id="checkoutForm">

            <label>Your Name:</label>
            <input type="text" id="buyerName" required>

            <label>Phone Number:</label>
            <input type="tel" id="buyerPhone"
            pattern="[0-9]{10}" required>

            <label>Delivery Address:</label>
            <textarea id="buyerAddress" required></textarea>

            <button type="submit">Confirm Purchase</button>

        </form>

        <button class="cancel-btn" onclick="showPage('buy')">
            Cancel
        </button>

    </div>

</section>

</main>

<footer>
    <p>© 2026 ReUse Market | Buy Smart, Reuse More</p>
</footer>


<script>

// LOAD DATA

let products = JSON.parse(localStorage.getItem("products")) || [];

let users = JSON.parse(localStorage.getItem("users")) || [];

let selectedProductId = null;

let currentUser = JSON.parse(sessionStorage.getItem("currentUser")) || null;


// SAVE DATA

function saveProducts() {
    localStorage.setItem("products", JSON.stringify(products));
}

function saveUsers() {
    localStorage.setItem("users", JSON.stringify(users));
}


// CHANGE PAGES

function showPage(pageName) {

    if (!currentUser && pageName !== "login") {
        alert("Please login first.");
        return;
    }

    if (pageName === "buy" && currentUser.role !== "buyer") {
        alert("Only buyers can access this page.");
        return;
    }

    if (pageName === "sell" && currentUser.role !== "seller") {
        alert("Only sellers can access this page.");
        return;
    }

    if (pageName === "checkout" && currentUser.role !== "buyer") {
        alert("Only buyers can purchase products.");
        return;
    }

    document.querySelectorAll(".page").forEach(page => {
        page.classList.add("hidden");
    });

    document.getElementById(pageName).classList.remove("hidden");

    if (pageName === "buy") {
        displayProducts();
    }

    window.scrollTo(0, 0);
}


// UPDATE NAVIGATION

function updateNavigation() {

    const navbar = document.getElementById("navbar");

    if (!currentUser) {

        navbar.classList.add("hidden");

        showPage("login");

        return;
    }

    navbar.classList.remove("hidden");

    document.getElementById("buyNav").classList.toggle(
        "hidden", currentUser.role !== "buyer"
    );

    document.getElementById("sellNav").classList.toggle(
        "hidden", currentUser.role !== "seller"
    );

    document.getElementById("welcomeMessage").textContent =
        "Welcome " + currentUser.username + "! You are logged in as " + currentUser.role;

    document.getElementById("homeBuyButton").classList.toggle(
        "hidden", currentUser.role !== "buyer"
    );

    document.getElementById("homeSellButton").classList.toggle(
        "hidden", currentUser.role !== "seller"
    );

    showPage("home");
}


// REGISTER

document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const role = document.getElementById("registerRole").value;

    const username = document.getElementById("registerUsername").value.trim();

    const password = document.getElementById("registerPassword").value;

    if (users.some(u =>
        u.username.toLowerCase() === username.toLowerCase() &&
        u.role === role
    )) {

        document.getElementById("registerMessage").textContent =
            "Account already exists!";

        return;
    }

    users.push({
        username: username,
        password: password,
        role: role
    });

    saveUsers();

    document.getElementById("registerMessage").textContent =
        "Account created successfully! Please login.";

    document.getElementById("registerForm").reset();

});


// BUYER LOGIN

document.getElementById("buyerLoginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("buyerLoginUsername").value.trim();

    const password = document.getElementById("buyerLoginPassword").value;

    const user = users.find(u =>
        u.username === username &&
        u.password === password &&
        u.role === "buyer"
    );

    if (!user) {

        document.getElementById("loginMessage").textContent =
            "Invalid buyer username or password.";

        return;
    }

    loginUser(user);

});


// SELLER LOGIN

document.getElementById("sellerLoginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("sellerLoginUsername").value.trim();

    const password = document.getElementById("sellerLoginPassword").value;

    const user = users.find(u =>
        u.username === username &&
        u.password === password &&
        u.role === "seller"
    );

    if (!user) {

        document.getElementById("loginMessage").textContent =
            "Invalid seller username or password.";

        return;
    }

    loginUser(user);

});


// LOGIN USER

function loginUser(user) {

    currentUser = {
        username: user.username,
        role: user.role
    };

    sessionStorage.setItem("currentUser", JSON.stringify(currentUser));

    document.getElementById("loginMessage").textContent = "";

    document.getElementById("buyerLoginForm").reset();

    document.getElementById("sellerLoginForm").reset();

    updateNavigation();

}


// LOGOUT

function logout() {

    currentUser = null;

    sessionStorage.removeItem("currentUser");

    selectedProductId = null;

    updateNavigation();

}


// DISPLAY PRODUCTS

function displayProducts() {

    const productList = document.getElementById("productList");

    const search = document.getElementById("searchInput").value.toLowerCase();

    const category = document.getElementById("categoryFilter").value;

    productList.innerHTML = "";

    const filteredProducts = products.filter(product => {

        return product.name.toLowerCase().includes(search) &&
            (category === "All" || product.category === category);

    });

    if (filteredProducts.length === 0) {

        productList.innerHTML =
            `<p class="no-products">No products available.</p>`;

        return;
    }

    filteredProducts.forEach(product => {

        const card = document.createElement("div");

        card.className = "product-card";

        const image = document.createElement("img");

        image.src = product.image || "https://placehold.co/300x170?text=No+Image";

        image.alt = product.name;

        image.onerror = function() {
            this.src = "https://placehold.co/300x170?text=No+Image";
        };

        const name = document.createElement("h3");
        name.textContent = product.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = "₹" + product.price;

        const categoryText = document.createElement("p");
        categoryText.textContent = "Category: " + product.category;

        const description = document.createElement("p");
        description.textContent = product.description;

        const seller = document.createElement("p");
        seller.textContent = "Seller: " + product.seller;

        const buyButton = document.createElement("button");

        buyButton.className = "buy-btn";
        buyButton.textContent = "Buy Now";

        buyButton.onclick = function() {
            openCheckout(product.id);
        };

        card.appendChild(image);
        card.appendChild(name);
        card.appendChild(price);
        card.appendChild(categoryText);
        card.appendChild(description);
        card.appendChild(seller);
        card.appendChild(buyButton);

        productList.appendChild(card);

    });

}


// SELL PRODUCT

document.getElementById("sellForm").addEventListener("submit", function(e) {

    e.preventDefault();

    if (!currentUser || currentUser.role !== "seller") {
        alert("Please login as a seller.");
        return;
    }

    const product = {

        id: Date.now(),

        name: document.getElementById("productName").value.trim(),

        price: Number(document.getElementById("productPrice").value),

        category: document.getElementById("productCategory").value,

        description: document.getElementById("productDescription").value.trim(),

        seller: currentUser.username,

        image: document.getElementById("productImage").value.trim()

    };

    products.push(product);

    saveProducts();

    document.getElementById("sellMessage").textContent =
        "Product posted successfully!";

    document.getElementById("sellForm").reset();

});


// OPEN CHECKOUT

function openCheckout(productId) {

    const product = products.find(p => p.id === productId);

    if (!product) {
        alert("Product not found.");
        return;
    }

    selectedProductId = productId;

    document.getElementById("checkoutProduct").textContent =
        product.name + " - ₹" + product.price + " | Seller: " + product.seller;

    showPage("checkout");

}


// CONFIRM PURCHASE

document.getElementById("checkoutForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const product = products.find(p => p.id === selectedProductId);

    if (!product) {
        alert("Product is no longer available.");
        showPage("buy");
        return;
    }

    const order = {

        productName: product.name,

        price: product.price,

        buyerUsername: currentUser.username,

        buyerName: document.getElementById("buyerName").value,

        buyerPhone: document.getElementById("buyerPhone").value,

        buyerAddress: document.getElementById("buyerAddress").value,

        purchaseDate: new Date().toLocaleString()

    };

    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    orders.push(order);

    localStorage.setItem("orders", JSON.stringify(orders));

    products = products.filter(p => p.id !== selectedProductId);

    saveProducts();

    alert("Purchase successful!");

    document.getElementById("checkoutForm").reset();

    selectedProductId = null;

    showPage("buy");

});


// SEARCH

document.getElementById("searchInput").addEventListener("input", displayProducts);


// CATEGORY FILTER

document.getElementById("categoryFilter").addEventListener("change", displayProducts);


// INITIAL PAGE

updateNavigation();

</script>

</body>
</html>
