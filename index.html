<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReUse Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>ReUse Market</h1>
    <p>Buy Smart. Sell Easy.</p>
</header>

<nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('buy')">Buy Products</button>
    <button onclick="showPage('sell')">Sell Products</button>
</nav>

<!-- HOME PAGE -->
<section id="home" class="page">
    <div class="hero">
        <h1>Welcome to ReUse Market</h1>
        <p>Buy and sell second-hand products at affordable prices.</p>

        <button onclick="showPage('buy')">Buy Products</button>
        <button onclick="showPage('sell')">Sell Products</button>
    </div>
</section>

<!-- BUY PAGE -->
<section id="buy" class="page" style="display:none">

    <h2>Available Products</h2>

    <div class="search-box">
        <input type="text" id="searchInput"
        placeholder="Search products...">

        <select id="categoryFilter">
            <option value="All">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
            <option value="Books">Books</option>
            <option value="Vehicles">Vehicles</option>
            <option value="Clothing">Clothing</option>
        </select>
    </div>

    <div id="productList" class="product-container"></div>

</section>

<!-- SELL PAGE -->
<section id="sell" class="page" style="display:none">

    <div class="sell-section">

        <h2>Sell Your Product</h2>

        <form id="sellForm">

            <label>Product Name:</label>
            <input type="text" id="productName" required>

            <label>Price (₹):</label>
            <input type="number" id="productPrice" min="1" required>

            <label>Category:</label>
            <select id="productCategory">
                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Books">Books</option>
                <option value="Vehicles">Vehicles</option>
                <option value="Clothing">Clothing</option>
            </select>

            <label>Description:</label>
            <textarea id="productDescription" required></textarea>

            <label>Seller Name:</label>
            <input type="text" id="sellerName" required>

            <label>Product Image URL:</label>
            <input type="url" id="productImage">

            <button type="submit">Post Product</button>

        </form>

        <p id="sellMessage"></p>

    </div>

</section>

<!-- CHECKOUT -->
<div id="checkoutModal" class="modal">

    <div class="modal-content">

        <button class="close-button" onclick="closeCheckout()">X</button>

        <h2>Checkout</h2>

        <p id="checkoutProduct"></p>
        <p id="checkoutPrice"></p>

        <form id="checkoutForm">

            <input type="text" id="buyerName"
            placeholder="Your Name" required>

            <input type="tel" id="buyerPhone"
            placeholder="Phone Number"
            pattern="[0-9]{10}" required>

            <textarea id="buyerAddress"
            placeholder="Delivery Address" required></textarea>

            <select id="paymentMethod">
                <option value="COD">Cash on Delivery</option>
                <option value="UPI">UPI (Demo Only)</option>
            </select>

            <button type="submit">Place Order</button>

        </form>

        <p id="orderMessage"></p>

    </div>

</div>

<footer>
    <p>© 2026 ReUse Market</p>
</footer>

<script src="script.js"></script>

</body>
</html>
